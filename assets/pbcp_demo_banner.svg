<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" rx="10" fill="url(#bg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left accent strip -->
  <rect x="0" y="0" width="5" height="180" rx="2" fill="#60A5FA"/>

  <!-- Decorative blobs (top right) -->
  <circle cx="840" cy="28" r="62" fill="#DBEAFE" opacity="0.38"/>
  <circle cx="878" cy="72" r="40" fill="#EDE9FE" opacity="0.32"/>
  <circle cx="862" cy="0" r="28" fill="#D1FAE5" opacity="0.40"/>

  <!-- Project label -->
  <text x="36" y="30"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="10" font-weight="600" letter-spacing="1.8" fill="#94A3B8">IACG v2.0  ·  Cloud Systems Research</text>

  <!-- Title -->
  <text x="36" y="58"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="23" font-weight="700" fill="#1F2937">PBCP Live Research Demo</text>

  <!-- Subtitle -->
  <text x="36" y="80"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13" fill="#64748B">Pre-Billing Cost Prevention  ·  Intent-Aware Cloud Governance</text>

  <!-- Pills -->
  <rect x="36"  y="97" width="46" height="22" rx="11" fill="#DBEAFE"/>
  <text x="59"  y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">CPS</text>

  <rect x="90"  y="97" width="44" height="22" rx="11" fill="#EDE9FE"/>
  <text x="112" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">IFS</text>

  <rect x="142" y="97" width="78" height="22" rx="11" fill="#D1FAE5"/>
  <text x="181" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">EV Model</text>

  <rect x="228" y="97" width="86" height="22" rx="11" fill="#FEF3C7"/>
  <text x="271" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">FAISS KNN</text>

  <rect x="322" y="97" width="152" height="22" rx="11" fill="#FCE7F3"/>
  <text x="398" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="#9D174D" text-anchor="middle">Runtime Optimization</text>

  <!-- Divider -->
  <line x1="36" y1="133" x2="864" y2="133" stroke="#E2E8F0" stroke-width="1"/>

  <!-- CTA button -->
  <rect x="597" y="145" width="246" height="24" rx="6" fill="#2563EB"/>
  <text x="720" y="161"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Launch Streamlit Demo  →</text>

  <!-- CTA left label -->
  <text x="36" y="161"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" fill="#94A3B8">intent-aware-cloud-governance.streamlit.app</text>
</svg>
